name: EMA200 Scanner

on:
  schedule:
    # 16:00 IST = 10:30 UTC, Monday se Friday
    - cron: "30 10 * * 1-5"
  workflow_dispatch:   # manual test run ke liye

permissions:
  contents: write      # history file wapas repo mein commit karne ke liye

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install yfinance pandas openpyxl requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_200ema_scanner.py

      - name: Save history for next run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ema200_history.json nse_stock_list_backup.txt || true
          git diff --cached --quiet || git commit -m "Update EMA200 history [skip ci]"
          git push
